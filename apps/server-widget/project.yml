name: FinArchServerWidget
options:
  bundleIdPrefix: com.wooix.finarch
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FinArchServerWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooix.finarch.serverwidget
        PRODUCT_NAME: FinArchServerWidget
        ENABLE_APP_SANDBOX: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: FinArch Servers
        LSUIElement: true
        FinArchProjectRoot: "$(SRCROOT)/../.."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
