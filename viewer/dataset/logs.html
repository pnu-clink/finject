<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실행 로그</title>
<link rel="stylesheet" href="/i18n.css"><script src="/i18n.js" defer></script><style>
body{font:15px system-ui;margin:0;background:#f4f7fa;color:#17313f}header{position:sticky;top:0;background:white;padding:18px 24px;border-bottom:1px solid #ccd8df;z-index:1}h1{font-size:22px;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,input,button{font:inherit;padding:8px;border:1px solid #a9bdc9;border-radius:5px;background:white}input[type=search]{width:300px}main{padding:18px 24px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #d5e0e6;vertical-align:top}th{white-space:nowrap}tr.llm{background:#e6f3ff}tr.python{background:#fff4e5}tr.fail{background:#ffe4e4;color:#8b1820}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;max-height:65vh;overflow:auto;font:13px ui-monospace,monospace}summary{cursor:pointer}.badge{padding:4px 8px;border-radius:4px}#status{margin:12px 0 0;color:#506572}.empty{padding:30px}.legend{margin-top:10px;display:flex;gap:10px}a{color:#006c73}
</style>
<header><h1>실행 로그</h1><div class="controls"><label>실행 <select id="run"></select></label><label>파일 <select id="file"></select></label><input type="search" id="search" placeholder="기능명 또는 내용 검색" aria-label="기능명 또는 내용 검색"><button id="reload">처음부터 읽기</button><button id="more">다음 기록 읽기</button><label><input type="checkbox" id="live" checked> 자동 갱신</label><a href="/" target="_blank">데이터 뷰어</a></div><div class="legend"><span class="badge" style="background:#e6f3ff">LLM</span><span class="badge" style="background:#fff4e5">Python</span><span class="badge" style="background:#ffe4e4">실패</span></div><p id="status">실행 목록을 읽고 있습니다.</p></header>
<main><table><thead><tr><th>순번 · 시간</th><th>문항</th><th>기능명</th><th>기록</th><th>내용</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=id=>document.getElementById(id),files=['default.log','pipeline.log','detail.log','llm.log','llm-ic-value.log','llm-ic-source.log','llm-ic-relation.log','llm-ea.log','cli.log'];
let offset=0,records=[],busy=false,version=0,hasMore=false;
for(const name of files)$('file').add(new Option(name,name));
function cell(row,text){const c=document.createElement('td');c.textContent=text??'';row.append(c);return c;}
function render(){const q=$('search').value.toLowerCase(),body=$('rows');body.replaceChildren();let shown=0;for(const r of records){if(q&&!JSON.stringify(r).toLowerCase().includes(q))continue;shown++;const tr=document.createElement('tr'),data=r[r.function],failure=data?.status==='FAIL'||data?.value?.status==='FAIL';tr.className=failure?'fail':r.kind==='llm'||r.log.startsWith('llm')?'llm':'python';cell(tr,`${r.sequence??'—'} · ${new Date(r.timestamp).toLocaleString(globalThis.FinarchI18n?.language === 'ko' ? 'ko-KR' : 'en-US',{hour12:false})}`);cell(tr,r.problem_id??'—');cell(tr,r.function);cell(tr,`${r.log} · ${r.phase??''}`);const c=cell(tr,'');if(data!==undefined){const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=(failure?'실패 · ':'')+(data.path??data.reason??'입출력·상세 펼치기');pre.textContent=JSON.stringify(data,null,2);details.append(summary,pre);c.append(details);}else c.textContent='기능 호출';body.append(tr);}if(!shown){const tr=document.createElement('tr'),c=cell(tr,records.length?'검색 결과가 없습니다.':'기록이 없습니다.');c.colSpan=5;c.className='empty';body.append(tr);}$('status').textContent=`${$('run').value||'실행 없음'} · ${$('file').value} · 읽은 기록 ${records.length}건 / 표시 ${shown}건${hasMore?' · 뒤에 기록이 더 있습니다.':''}`;}
async function load(){if(busy||!$('run').value)return;busy=true;const current=version;try{const response=await fetch('/api/purpose-log?'+new URLSearchParams({run:$('run').value,file:$('file').value,offset}));if(!response.ok)throw Error(await response.text());const result=await response.json();if(current!==version)return;offset=result.offset;hasMore=result.more;records.push(...result.records);render();if(result.damaged.length)$('status').textContent+=' · 읽지 못한 JSON 행이 있습니다.';}catch(e){$('status').textContent='로그 읽기 실패: '+e.message;}finally{busy=false;}}
function reset(){version++;offset=0;records=[];hasMore=false;render();load();}
$('file').onchange=$('reload').onclick=reset;$('run').onchange=async()=>{await listFiles();reset();};$('more').onclick=load;$('search').oninput=render;
async function listFiles(){const r=await fetch('/api/purpose-log-files?'+new URLSearchParams({run:$('run').value}));if(!r.ok)return;const names=await r.json(),selected=$('file').value;$('file').replaceChildren(...names.map(n=>new Option(n,n)));if(names.includes(selected))$('file').value=selected;}
async function list(){try{const response=await fetch('/api/purpose-log-runs');if(!response.ok)throw Error('실행 목록 조회 실패');const runs=await response.json(),selected=$('run').value||new URLSearchParams(location.search).get('run');$('run').replaceChildren(...runs.map(r=>new Option(r,r)));if(runs.includes(selected))$('run').value=selected;await listFiles();render();}catch(e){$('status').textContent=e.message;}}
(async()=>{await list();await load();setInterval(async()=>{if($('live').checked){if(!$('run').value)await list();else await listFiles();await load();}},2000);})();
</script></html>
