[project]
name = "fin-arch"
version = "0.1.0"
description = "Program-grounded financial evidence-state dataset research"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "psutil>=5.9", "jsonschema>=4,<5"]

[project.optional-dependencies]
viewer = ["pysimdjson==7.0.2", "orjson==3.12.0"]

[project.scripts]
fin-arch = "finarch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finarch"]
