<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annotation 재검토 요청</title>
<style>
:root{--ink:#173343;--muted:#627580;--line:#dce4e8;--green:#006e68;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}header{padding:18px 22px;background:#132f3b;color:white}h1{font-size:21px;margin:0}header p{font-size:12px;color:#d1e3e6;margin:5px 0 0}.workspace{display:grid;grid-template-columns:240px minmax(0,1fr)}aside{padding:15px;background:white;border-right:1px solid var(--line);position:sticky;top:0;height:calc(100vh - 91px)}input,select,button{font:inherit}input,select{width:100%;padding:8px;border:1px solid #bdcdd3;border-radius:5px;background:white;color:var(--ink);margin-bottom:7px}button{cursor:pointer;border:1px solid #bdcdd3;border-radius:5px;background:white;color:var(--ink);padding:6px 10px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #71b5d2;outline-offset:2px}.count,.meta{font-size:12px;color:var(--muted)}nav{height:calc(100% - 145px);overflow:auto;margin-top:8px}.request-button{display:block;width:100%;padding:10px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:12px;white-space:normal}.request-button.selected{background:#e4f2ef;box-shadow:inset 3px 0 var(--green)}.request-button small{display:block;color:var(--muted)}main{padding:20px;min-width:0;max-width:1280px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:21px;margin:0}h3{font-size:15px;margin:0 0 8px}.navigation{display:flex;gap:5px}.card{background:white;border:1px solid var(--line);border-radius:6px;padding:15px;margin:12px 0}.manager{border-left:4px solid var(--green);background:#eef8f5}.repair{border-left-color:var(--red);background:#fff3ef}.prose{white-space:pre-wrap;overflow-wrap:anywhere}.manager .prose{font-size:15px;font-weight:600}.original-note{color:var(--muted);font-size:13px}.badge{font-size:11px;font-weight:700;background:#e4f2ef;color:var(--green);padding:3px 7px;border-radius:4px;margin-right:6px}.badge.red{color:var(--red);background:#ffe9e3}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.split .card{margin-top:0}details summary{cursor:pointer;font-weight:600}.source{font:11px/1.6 ui-monospace,monospace;color:var(--muted)}.empty{padding:28px;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin:12px 0}a{color:var(--green)}@media(max-width:760px){.workspace{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{height:180px}.split{grid-template-columns:1fr}main{padding:14px}.heading{flex-wrap:wrap}}@media print{aside,.navigation{display:none}.workspace{display:block}header{background:white;color:var(--ink)}header p{color:var(--muted)}main{padding:0}.card{break-inside:avoid}details{display:block}}
</style></head>
<body><header><h1 id="title"></h1><p id="scope"></p></header><div class="workspace"><aside><label for="search">요청 검색</label><input id="search" type="search" placeholder="문제 번호·유형·주석"><select id="kind" aria-label="요청 종류"><option value="ALL">전체 요청</option><option value="RECHECK">재검토 요청</option><option value="WHY">평가 이유 문의</option><option value="REPAIR">문항 수정 필요</option></select><div id="count" class="count"></div><nav id="requests" aria-label="요청 목록"></nav></aside><main id="main" tabindex="-1"></main></div>
<style>__FINARCH_I18N_CSS__</style>
<script>__FINARCH_I18N_JS__</script>
<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),kinds={RECHECK:'재검토 요청',WHY:'평가 이유 문의',REPAIR:'문항 수정 필요'},decisions={APPROVED:'통과',REJECTED:'실패',PENDING:'유보'};
const $=id=>document.getElementById(id);let selected=data.requests[0]?.id,search='',kind='ALL';
function el(tag,cls='',text=''){const value=document.createElement(tag);value.className=cls;value.textContent=text;return value;}
function action(text,fn){const value=el('button','',text);value.type='button';value.onclick=fn;return value;}
function visible(){return data.requests.filter(entry=>(kind==='ALL'||entry.kind===kind)&&[entry.case,entry.title,entry.note].join(' ').toLowerCase().includes(search.toLowerCase()));}
function card(title,text,cls=''){const value=el('section','card '+cls);value.append(el('h3','',title),el('div','prose',text||'기록 없음'));return value;}
function draw(){
 const items=visible();if(!items.some(entry=>entry.id===selected))selected=items[0]?.id;$('requests').replaceChildren();$('count').textContent=items.length+' / '+data.requests.length+'건';
 for(const entry of items){const button=action(entry.case+' · '+entry.title,()=>{selected=entry.id;draw();});button.className='request-button'+(selected===entry.id?' selected':'');button.append(el('small','',kinds[entry.kind]));button.setAttribute('aria-current',String(selected===entry.id));$('requests').append(button);}
 const main=$('main');main.replaceChildren();const entry=items.find(value=>value.id===selected);if(!entry){main.append(el('p','empty','조건에 맞는 요청이 없습니다.'));return;}
 const heading=el('div','heading'),navigation=el('div','navigation'),at=items.indexOf(entry),previous=action('← Q',()=>move(-1)),next=action('E →',()=>move(1));previous.disabled=at===0;next.disabled=at===items.length-1;navigation.append(previous,next);heading.append(el('h2','',entry.case+' · '+entry.title),navigation);main.append(heading);
 const badges=el('p');badges.append(el('span','badge'+(entry.kind==='REPAIR'?' red':''),kinds[entry.kind]));if(entry.reviewer)badges.append(el('span','badge',entry.reviewer));main.append(badges,card('관리자 요청·주석',entry.note||'주석 없음','manager'+(entry.kind==='REPAIR'?' repair':'')));
 if(entry.manager_case_note)main.append(card('문항 전체 관리자 메모',entry.manager_case_note));
 for(const [reviewer,rating] of Object.entries(entry.ratings)){const value=card('기존 평가 · '+reviewer,decisions[rating.decision]||(rating.missing?'미입력':'판정 미확인'));value.append(el('p','original-note prose',rating.comment||'평가자 주석 없음'));main.append(value);}
 const evidence=entry.evidence||{};
 if(evidence.question)main.append(card('질문',evidence.question));
 if(evidence.status==='AVAILABLE'){
  const full=card('변형 전체 본문 · perturbed',evidence.context);full.id='full-context';main.append(full);
  if(evidence.input_context){const original=el('details','card');original.append(el('summary','','문장 생성 입력 본문 펼치기'),el('div','prose',evidence.input_context));main.append(original);}
 }else main.append(card('전체 본문 확인',evidence.reason||'해당 생성 본문을 확인할 수 없습니다.'));
 for(const source of entry.sources){for(const record of source.records){const split=el('div','split');if(record.inserted)split.append(card('추가 문장',record.inserted));if(record.removed)split.append(card('삭제 문장',record.removed));if(split.children.length)main.append(split);}}
 const provenance=el('details','card');provenance.append(el('summary','','입력 파일·근거'));
 for(const source of entry.sources)provenance.append(el('p','source prose',source.filename+'\nSHA-256: '+source.sha256));
 if(evidence.run)provenance.append(el('p','source',evidence.run+' · '+evidence.round+' · 본문 SHA-256: '+evidence.context_sha256));main.append(provenance,el('footer','','Q / E 이전·다음 요청 · W / S 위아래 · 인터넷 없이 이 HTML에서 확인할 수 있습니다.'));
}
function move(direction){const items=visible(),next=items[items.findIndex(entry=>entry.id===selected)+direction];if(next){selected=next.id;draw();window.scrollTo({top:0});}}
$('title').textContent=data.annotator?data.annotator+' · Annotation 재검토':'문항 수정 요청';document.title=$('title').textContent;$('scope').textContent=data.date+' · '+data.requests.length+'건 · '+(data.scope.run||'평가 입력별 요청')+' · 관리자 기록 '+data.review_revision;
$('search').oninput=()=>{search=$('search').value;draw();};$('kind').onchange=()=>{kind=$('kind').value;draw();};
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey||event.repeat||event.isComposing||event.target.closest('input,select,textarea,[contenteditable]'))return;const key=/^Key[A-Z]$/.test(event.code||'')?event.code.slice(3).toLowerCase():event.key.toLowerCase();if(key==='q'||event.key==='ArrowLeft'){move(-1);event.preventDefault();}else if(key==='e'||event.key==='ArrowRight'){move(1);event.preventDefault();}else if(key==='w'||key==='s'){window.scrollBy({top:(key==='w'?-1:1)*innerHeight*.5});event.preventDefault();}});draw();
</script></body></html>
