name: FinArchServerWidget
options:
  bundleIdPrefix: org.finject
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FinArchServerWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.finject.serverwidget
        PRODUCT_NAME: FInjectServerWidget
        ENABLE_APP_SANDBOX: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleDisplayName: FInject Servers
        LSUIElement: true
        FinArchProjectRoot: "$(SRCROOT)/../.."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
