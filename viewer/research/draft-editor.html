<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FInject 한글 Draft v2 편집기</title>
<style>
:root{color-scheme:light;--ink:#243142;--blue:#1556c0;--rule:#dce3eb}*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:var(--ink);font:17px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}button,input{font:inherit}button{border:1px solid #cbd5e1;border-radius:7px;padding:7px 13px;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:650}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 24px;background:white;border-bottom:1px solid var(--rule)}.brand{font-size:18px;font-weight:750}.brand small{display:block;font-size:12px;font-weight:400;color:#637086}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions a{font-size:14px;color:var(--blue);text-decoration:none;padding:7px}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:24px;max-width:1500px;margin:auto;padding:24px}nav{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 128px);overflow:auto;font-size:13px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;line-height:1.55;color:#526176}nav button.sub{padding-left:22px}nav button.current{background:#e8f0ff;color:var(--blue);font-weight:650;border-left:3px solid var(--blue);border-radius:0}.main{min-width:0}.paper{background:white;border:1px solid var(--rule);border-radius:10px;padding:30px 38px}.title{width:100%;border:0;border-bottom:1px solid var(--rule);font-size:24px;font-weight:700;padding:0 0 14px;background:transparent;color:var(--ink);outline:none}.title:focus{border-color:var(--blue)}.format{display:flex;gap:6px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:18px}.format button{font-size:14px;line-height:1.5;padding:4px 10px}.format span{margin-left:auto;font-size:12px;color:#728197}.document{min-height:500px;outline:none;overflow-wrap:anywhere}.document p{margin:0 0 18px}.document a{color:var(--blue)}.document strong{font-weight:700}.document figure{margin:26px 0;padding:12px 0}.document img{max-width:100%;height:auto;display:block;margin:auto}.document figcaption,.table-note{font-size:13px;line-height:1.7;color:#64748b}.document .comparison{overflow-x:auto;margin:24px 0}.document table{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}.document th,.document td{border-bottom:1px solid #dce3eb;padding:8px;vertical-align:top}.document th{background:#f0f4fa}.document .table-caption{font-size:14px;font-weight:650;color:var(--ink);margin-bottom:9px}.document math{font-size:1em}.document .aside,.document .pending{border-left:3px solid #cc9f3f;background:#fff5df;padding:12px 16px;font-size:14px}.document pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px;font-size:14px}.document [data-editor-protected]{cursor:default}.source{font-size:12px;line-height:1.7;color:#6b7a8e;margin:14px 2px}.status{font-size:13px;line-height:1.5;min-height:20px}.status.dirty{color:#99691f}.status.error{color:#b42318}.status.ok{color:#28724d}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px}nav{position:static;max-height:160px;border-bottom:1px solid var(--rule)}.paper{padding:24px 18px}header{padding:12px;flex-wrap:wrap}.title{font-size:21px}.format span{display:none}}
.document p.term-lead-gap{padding-top:.2775em;padding-top:.15lh}
table :is(th, td)[data-cell-align="left"] { text-align: left !important; }
</style><style id="table-content-alignment">
table th, table td[data-cell-align="center"] { text-align: center !important; }
table td[data-cell-align="right"] { text-align: right !important; }
</style>
</head><body>
<header><div class="brand">FInject / 한글 Draft v2 편집기<small>현재 PDF에 대응하는 한글 원문입니다. 저장하면 Draft v2에도 반영됩니다.</small></div><div class="actions"><span id="status" class="status" role="status" aria-live="polite">원문을 불러오는 중입니다.</span><button id="reload" type="button">최신 원문</button><a id="preview" href="/draft#s1" target="_blank" rel="noopener">Draft 보기 ↗</a><button id="save" class="primary" type="button" disabled>저장 / Draft 반영</button></div></header>
<div class="layout"><nav id="toc" aria-label="한글 Draft 목차"></nav><main class="main"><div class="paper"><input id="title" class="title" aria-label="절 제목" disabled><div class="format"><button data-command="bold" type="button"><b>굵게</b></button><button data-command="italic" type="button"><i>기울임</i></button><button data-command="undo" type="button">되돌리기</button><button data-command="redo" type="button">다시 실행</button><span>⌘S / Ctrl+S로 저장</span></div><article id="document" class="document" contenteditable="false" spellcheck="false" aria-label="한글 Draft 본문"></article></div><p class="source">절을 선택하고 본문을 바로 수정하세요. 표 / 그림 / 수식은 그대로 표시합니다. 수정한 절은 한글 원문과 기존 한글 / 영문 Revision Draft 화면에 저장됩니다. 영어 문장은 이 편집기에서 번역하지 않습니다.</p></main></div>
<script>
'use strict';
const toc=document.querySelector('#toc'),editor=document.querySelector('#document'),title=document.querySelector('#title'),status=document.querySelector('#status'),saveButton=document.querySelector('#save'),reloadButton=document.querySelector('#reload'),preview=document.querySelector('#preview');
let sections=[],current=null,dirty=false,busy=false;
function message(text,kind=''){status.textContent=text;status.className='status '+kind;}
function buttons(){saveButton.disabled=busy||!current||!dirty;reloadButton.disabled=busy||!current;reloadButton.textContent=dirty?'수정 취소 / 최신 원문':'최신 원문';title.disabled=busy||!current;editor.contentEditable=String(!busy&&Boolean(current));}
function spaceTermParagraphs(container){
 for(const paragraph of container.querySelectorAll('p')){
  const first=[...paragraph.childNodes].find(node=>node.textContent.trim());
  const previous=paragraph.previousElementSibling;
  const hasExplanation=first&&[...paragraph.childNodes].slice([...paragraph.childNodes].indexOf(first)+1).some(node=>node.textContent.trim());
  const eligible=!paragraph.closest('table,figure,pre,li')&&first?.nodeType===1&&['STRONG','B'].includes(first.tagName)&&hasExplanation&&previous?.tagName==='P'&&previous.textContent.trim()&&!previous.matches('.table-caption,.table-note,.response-example-label,[data-equation-number]')&&!previous.querySelector('math[display="block"]');
  paragraph.classList.toggle('term-lead-gap',Boolean(eligible));
 }
}
function markDirty(){if(!current||busy)return;spaceTermParagraphs(editor);dirty=true;message('저장하지 않은 수정이 있습니다.','dirty');buttons();}
async function api(url,options={}){const response=await fetch(url,{cache:'no-store',...options});const body=await response.json();if(!response.ok)throw Error(body.error||'요청을 처리하지 못했습니다.');return body;}
function protection(){editor.querySelectorAll('figure,.comparison,math,pre').forEach(el=>{el.contentEditable='false';el.dataset.editorProtected='true';});spaceTermParagraphs(editor);}
function cleanContent(){const copy=editor.cloneNode(true);copy.removeAttribute('contenteditable');copy.querySelectorAll('[contenteditable],[data-editor-protected]').forEach(el=>{el.removeAttribute('contenteditable');el.removeAttribute('data-editor-protected');});copy.querySelectorAll('.term-lead-gap').forEach(el=>{el.classList.remove('term-lead-gap');if(!el.className)el.removeAttribute('class');});return copy.innerHTML;}
function navigation(){toc.replaceChildren();for(const s of sections){const b=document.createElement('button');b.type='button';b.textContent=s.title;b.className=(s.level?'sub ':'')+(s.id===current?.id?'current':'');b.addEventListener('click',()=>select(s.id));toc.append(b);}}
async function save(){if(!current||busy)return false;busy=true;buttons();message('한글 원문과 Draft에 저장하는 중입니다.');try{const result=await api('/api/section/'+encodeURIComponent(current.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:current.revision,title:title.value,html:cleanContent()})});current=result;dirty=false;sections.find(s=>s.id===result.id).title=result.title;navigation();const time=new Date(result.saved_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});message(time+' 저장 완료 / Draft 반영 완료','ok');return true;}catch(e){message(e.message,'error');return false;}finally{busy=false;buttons();}}
async function select(id){if(busy)return;if(dirty&&!(await save()))return;busy=true;buttons();message('한글 원문을 불러오는 중입니다.');try{const result=await api('/api/section/'+encodeURIComponent(id));current=result;title.value=result.title;editor.innerHTML=result.html;protection();dirty=false;navigation();history.replaceState(null,'','#'+result.id);preview.href='/draft#'+result.id;message('본문을 바로 수정하실 수 있습니다.');window.scrollTo({top:0});}catch(e){message(e.message,'error');}finally{busy=false;buttons();}}
editor.addEventListener('input',markDirty);title.addEventListener('input',markDirty);
editor.addEventListener('paste',event=>{event.preventDefault();const text=event.clipboardData.getData('text/plain');document.execCommand('insertText',false,text);});
editor.addEventListener('click',event=>{if(event.target.closest('a'))event.preventDefault();});
document.querySelectorAll('[data-command]').forEach(button=>{button.addEventListener('mousedown',e=>e.preventDefault());button.addEventListener('click',()=>{editor.focus();document.execCommand(button.dataset.command,false);markDirty();});});
saveButton.addEventListener('click',save);reloadButton.addEventListener('click',()=>{if(!current)return;if(dirty&&!confirm('저장하지 않은 수정을 취소하고 최신 원문을 불러오시겠습니까?'))return;dirty=false;select(current.id);});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(dirty)save();}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
(async()=>{if(location.protocol==='file:'){message('로컬 편집기로 연결하는 중입니다.');location.replace('http://127.0.0.1:8897/editor'+location.search+location.hash);return;}try{sections=await api('/api/index');navigation();const sid=decodeURIComponent(location.hash.slice(1));await select(sections.some(s=>s.id===sid)?sid:'s1');}catch(e){message(e.message,'error');}})();
</script></body></html>
