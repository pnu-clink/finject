<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EA 역산 재검토 비교 · dataset viewer</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172d40;background:#f3f6fa}body{margin:0}header{padding:18px 24px;background:white;border-bottom:1px solid #ccd6df}h1{font-size:21px;margin:8px 0}a{color:#175e96}select,input,button{font:inherit;padding:7px;border:1px solid #bdcbd8;border-radius:6px;background:white}button{cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#edf4fa;padding:10px 14px;border-radius:8px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px}.list{max-height:75vh;overflow:auto}.list button{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}.selected{border:2px solid #246da6!important;background:#e7f3ff}.main{min-width:0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}section{background:white;border:1px solid #d0dbe4;border-radius:8px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,monospace;background:#f6f8fb;padding:12px;border-radius:6px}mark{background:#fff0a6;color:inherit}.reason{line-height:1.6;white-space:pre-wrap}.muted{color:#536575;font-size:13px}.error{color:#a52722}#count{font-size:13px}details{margin:8px 0}.evidence{display:block;text-align:left;max-width:100%;margin:5px 0;white-space:pre-wrap;word-break:break-word;font-size:12px}@media(max-width:850px){.layout,.compare{grid-template-columns:1fr}.list{max-height:220px}}
</style>
<header><a href="/">dataset viewer</a><h1>EA 역산 재검토 비교</h1><p class="muted">삭제 후 Q/C만 검토한 오프라인 판정입니다. 외부 모델 호출 0건 · 사람의 의미 검증 PENDING · false는 완전한 불가능 증명이 아닙니다.</p>
<select id="snapshot" aria-label="결과 파일"></select> <button id="export-annotator">Annotator용 HTML Export · 전체 1,354개</button> <a id="annotator-preview" target="_blank" rel="noopener">Annotator 화면 열기</a> · <a href="/ea-inverse/comparison">두 평가자 Reject 검토</a><div id="cards" class="cards"></div></header>
<div class="layout"><aside><div class="toolbar"><select id="type" aria-label="EA 유형"><option value="">EA 두 유형</option><option>EA_01</option><option>EA_02</option></select><select id="scope" aria-label="비교 범위"><option value="changed">기존 판정 변경</option><option value="new">새로 판정</option><option value="all">전체</option></select></div><input id="search" placeholder="id 또는 출처 검색" aria-label="문항 검색"><p id="count"></p><div id="list" class="list"></div></aside><main id="main" class="main"><section>문항을 선택하시면 실제 Q/C와 이전·새 판정을 확인할 수 있습니다.</section></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let saved=[],current,token=0;
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('파일을 읽지 못했습니다: HTTP '+r.status);return r.json();}
function query(extra={}){return new URLSearchParams({run:current.run,file:current.file,...extra});}
function verdict(value,status){return value===true?'true · 역산 가능':value===false?'false · 유일한 복원 미확립':'UNKNOWN · '+status;}
function highlighted(text,spans){const pre=node('pre'),chars=Array.from(text);let start=0,merged=[];for(const e of [...spans].sort((a,b)=>a.start-b.start)){const last=merged.at(-1);if(last&&e.start<=last.end)last.end=Math.max(last.end,e.end);else merged.push({start:e.start,end:e.end});}for(const e of merged){pre.append(document.createTextNode(chars.slice(start,e.start).join('')),node('mark',chars.slice(e.start,e.end).join('')));start=e.end;}pre.append(document.createTextNode(chars.slice(start).join('')));return pre;}
function renderList(){const list=$('list');list.replaceChildren();const type=$('type').value,scope=$('scope').value,s=$('search').value.trim().toLowerCase();const rows=saved.filter(x=>(!type||x.type===type)&&(scope==='all'||scope==='changed'&&x.decision_changed||scope==='new'&&x.newly_reviewed)&&(!s||(x.id+' '+x.source_dataset).toLowerCase().includes(s)));$('count').textContent=rows.length+' / '+saved.length+'건';for(const x of rows){const b=node('button',x.id+' · '+x.type+'\n'+x.source_dataset+' · '+x.transition);b.dataset.key=x.id+':'+x.type;b.onclick=()=>select(x.id,x.type).catch(error);list.append(b);}if(!rows.length)list.append(node('p','조건에 맞는 항목이 없습니다.'));}
function reviewPanel(title,item){const box=node('section');box.append(node('h2',title),node('strong',verdict(item.inverse_possible,item.status)));const ir=item.review_record?.inverse_review;if(ir){box.append(node('h3','누락 수량'),node('p',ir.missing_quantity,'reason'),...(item.display_ko?[node('p',item.display_ko.missing_quantity,'reason')]:[]),node('h3','판정 이유'),node('p',ir.reason,'reason'),...(item.display_ko?[node('p',item.display_ko.reason,'reason')]:[]),node('h3','역산식'),node('pre',ir.formula??'null'));}else box.append(node('p','저장된 완료 판정이 없습니다. false로 계산하지 않습니다.','muted'));return box;}
async function select(id,type){const t=++token;const d=await get('/api/ea-inverse?'+query({case:id,type}));if(t!==token)return;for(const b of $('list').children)b.classList.toggle('selected',b.dataset.key===id+':'+type);const main=$('main');main.replaceChildren(node('h2',id+' · '+type+' · '+d.source_dataset));const cards=node('div',null,'compare');cards.append(reviewPanel('기존 판정',d.previous),reviewPanel('새 판정',d.new));main.append(cards);const ir=d.new.review_record.inverse_review,q=node('section');q.append(node('h2','실제 Question'),highlighted(d.new.question,ir.evidence.filter(e=>e.field==='question')));const c=node('section');c.append(node('h2','실제 Context · 노란색은 새 인용 근거'),highlighted(d.new.context,ir.evidence.filter(e=>e.field==='context')));main.append(q,c);const ev=node('details');ev.append(node('summary','새 인용 근거 '+ir.evidence.length+'개 · Unicode 좌표'));for(const e of ir.evidence){const p=node('pre',e.field+' ['+e.start+', '+e.end+')\n'+e.quote);ev.append(p);}main.append(ev);history.replaceState(null,'','/ea-inverse?'+query({case:id,type}));}
async function load(){current=JSON.parse($('snapshot').value);const d=await get('/api/ea-inverse?'+query());saved=d.items;const s=d.summary;$('cards').replaceChildren(...[['검토',s.items+'건'],['true',s.new_true+'건'],['false',s.new_false+'건'],['기존 판정 변경',s.changed_existing_decisions+'건'],['새로 판정',s.newly_reviewed+'건']].map(([a,b])=>node('div',a+' · '+b,'card')));renderList();if(params.get('case'))await select(params.get('case'),params.get('type')||'EA_01');else{const first=saved.find(x=>x.decision_changed);if(first)await select(first.id,first.type);}}
async function init(){const c=await get('/api/ea-inverse/catalog');for(const s of c.snapshots){const o=node('option',s.run+' / '+s.file);o.value=JSON.stringify(s);$('snapshot').append(o);if(s.run===params.get('run')&&s.file===params.get('file'))o.selected=true;}if(!c.snapshots.length)throw Error('검증된 결과 파일이 없습니다.');await load();}
$('snapshot').onchange=()=>load().catch(error);for(const id of ['type','scope','search'])$(id).oninput=renderList;function error(e){$('main').replaceChildren(node('section',e.message,'error'));}init().catch(error);
$('export-annotator').onclick=()=>{if(current)location.href='/api/ea-inverse/export?'+query();};
$('annotator-preview').onclick=e=>{if(current)e.currentTarget.href='/ea-inverse/annotator?'+query();};
</script></html>
