<!doctype html><meta charset="utf-8"><title>POT 인용 위치 보정</title>
<link rel="stylesheet" href="/i18n.css"><script src="/i18n.js" defer></script><style>body{font:16px system-ui;margin:32px;color:#193148}select{padding:8px}article{border:1px solid #bbcbd7;border-radius:8px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;background:#f3f6f8;padding:12px}small{color:#73818d}mark{background:#ffdf76} .bad{color:#b42336}</style>
<h1>POT 인용 위치 보정</h1><label>실행 <select id="run"><option>20260914-pot-api-luna-max</option></select></label> <select id="case"></select><p id="summary"></p><main></main>
<script>
const E=id=>document.getElementById(id);let rows,changes;
async function load(){const base='../reports/run/'+E('run').value+'/span-repair/';[rows,changes]=await Promise.all(['cases.json','changes.json'].map(n=>fetch(base+n).then(r=>r.json())));E('summary').textContent=`${rows.length}문항 · ${changes.length}개 span 수정 · 원본 보존 · Gold 비교 미수행`;const fixes=await fetch(base+'four-repair.json').then(r=>r.ok?r.json():[]);for(const f of fixes){const r=rows.find(x=>x.id===f.id);if(r){Object.assign(r,{status:f.status,reason:null,followup:f});r.response_path=r.response_path.replace('span-repair-01','review-repair-02')}}E('case').replaceChildren(...rows.map(r=>new Option(r.id+' · '+r.status,r.id)));show()}
function show(){const id=E('case').value,r=rows.find(x=>x.id===id),main=document.querySelector('main');main.replaceChildren();const p=document.createElement('p');p.textContent=r.response_path;main.append(p);if(r.followup){const n=document.createElement('p');n.textContent='추가 보정 완료 · 계산값 '+r.followup.validation.value+' · '+(r.followup.code_changed?'원본 풀이를 참고해 두 값의 산술평균으로 POT 수정':'계산용 숫자 정규화 적용');main.append(n)}if(r.reason){const p=document.createElement('p');p.className='bad';p.textContent='남은 검사 오류: '+r.reason;main.append(p)}for(const c of changes.filter(x=>x.case===id)){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),pre=document.createElement('pre'),s=document.createElement('small');h.textContent=c.fact_id+' · '+c.text;p.textContent=JSON.stringify(c.before)+' → '+JSON.stringify(c.after);pre.textContent=c.context;s.textContent=c.origin+' · '+c.method+' · 후보 '+c.candidates.join(', ');a.append(h,p,pre,s);main.append(a)}}
E('case').onchange=show;E('run').onchange=load;load().catch(e=>E('summary').textContent=e);
</script>
