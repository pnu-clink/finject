<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 제작 로그</title>
<link rel="stylesheet" href="/i18n.css"><script src="/i18n.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#203044;font:13px/1.4 system-ui}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ccd7e3;padding:8px 18px;z-index:2}h1{font-size:18px;margin:0 0 6px}h2{font-size:15px;margin:10px 0 5px}main{padding:8px 18px}button,select,input{font:inherit;padding:4px 7px;border:1px solid #bcc9da;border-radius:5px;background:white}button{cursor:pointer}button[aria-pressed=true]{background:#194f7d;color:white;border-color:#194f7d}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#617185}.cards{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.card{border:1px solid #d3deeb;background:white;border-radius:7px;padding:6px 10px}.card b{font-size:20px;display:block}.table-wrap{overflow:auto;max-height:60vh;background:white}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;position:sticky;top:0;background:#e9eef5;cursor:pointer;white-space:nowrap}td,th{padding:5px 7px;border-bottom:1px solid #e5eaf0;vertical-align:top}tr.llm,.tag.llm{background:#e2f2ff}tr.python,.tag.python{background:#fff1df}tr.failure{background:#ffe8e7}tr.failure td:first-child{border-left:3px solid #b8272e}.PASS,.RECEIVED,.AWAITING_HUMAN{color:#0a7650}.FAIL,.ERROR,.BLOCKED,.failure-link{color:#ad2027}.failure-link{border-color:#e1a3a5;background:#fff5f4;font-weight:700}.tag{display:inline-block;font-weight:700;border-radius:4px;padding:2px 6px}.tag.failure{background:#ffe0df;color:#a42027}.legend{margin:7px 0}.RUNNING{color:#1d5bd2}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;font:11px/1.4 ui-monospace,monospace}a{color:#1b58a7}#error{color:#b8272e}.current{padding:7px;background:#eaf1ff;border-left:3px solid #326bc8;margin:7px 0}.small{font-size:11px}dialog{width:min(1000px,95vw);max-height:88vh;border:1px solid #bac7d8;border-radius:9px;padding:14px;overflow:auto}dialog::backdrop{background:#10223666}dialog .dialog-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:white;padding:5px 0;z-index:1}dialog dl{display:grid;grid-template-columns:100px 1fr;gap:5px;margin:10px 0}dt{color:#617185}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.cause{border-left:4px solid #bb3035;background:#fff0ed;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.foot{display:flex;justify-content:space-between;padding:5px 0}.case-action{white-space:nowrap}
</style>
<header><h1>실시간 제작 로그</h1><div class="bar"><select id="run" aria-label="실행 선택"></select><button id="refresh">지금 갱신</button><label><input type="checkbox" id="auto" checked> 2초마다 갱신</label><span id="updated" class="muted"></span><a id="viewer">검토 뷰어</a></div></header>
<main><div id="error"></div><div id="phase" class="current"></div><div class="cards" id="metrics"></div><h2>문항별 제작 상태</h2><div id="cases"></div><h2 id="event-title">원본 이벤트 · 실제 기록 순서</h2><div class="bar" id="views" aria-label="로그 보기"><button data-view="all" aria-pressed="true">전체 보기</button><button data-view="llm" aria-pressed="false">LLM 로그 보기</button><button data-view="python" aria-pressed="false">Python 로그 보기</button><button data-view="fail" aria-pressed="false">실패 로그 보기</button><select id="case" aria-label="문항 필터"><option value="">전체 문항</option></select><label><input id="current" type="checkbox"> 이번 제작 시작 이후</label></div><div class="bar legend" aria-label="로그 범례"><span class="tag llm">LLM · 하늘색</span><span class="tag python">Python · 주황색</span><span class="tag failure">실패 · 빨간색</span><span class="muted small">실패 색상이 우선합니다. 오류를 누르면 원인이 열립니다. 열 제목으로 정렬할 수 있습니다.</span></div><div class="table-wrap"><table><thead><tr id="heads"></tr></thead><tbody id="events"></tbody></table></div><div class="foot"><span id="count" class="muted"></span><button id="more">더 보기</button></div></main>
<script>
const $=id=>document.getElementById(id),make=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text??'';if(cls)n.className=cls;return n;};let data=null,busy=false,sort='timestamp',dir=-1,view='all',limit=500;
const labels={START:'시작',END:'종료',ARTIFACT:'파일 저장',USAGE:'사용량',PASS:'처리 통과',FAIL:'실패',ERROR:'오류',RUNNING:'시작 기록',NOT_EVALUATED:'미평가',EXCLUDED:'제외',READY:'준비됨',PREPARING:'대기',GENERATING:'문장 생성',AUDITING:'의미 검사',AWAITING_HUMAN:'사람 검토 자료 준비됨',BLOCKED:'조건 불충족',COMPLETED:'처리 종료'};
const cols=[['timestamp','시각 (한국)'],['case','문항'],['kind','종류'],['role','역할'],['stage','단계·후보'],['phase','이벤트'],['status','결과'],['elapsed_seconds','소요 시간'],['content','기록 내용']];
function time(v){const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString(globalThis.FinarchI18n?.language === 'ko' ? 'ko-KR' : 'en-US',{timeZone:'Asia/Seoul',hour12:false}):'—';}
// [VL04] Display metadata is derived; raw entries and their source lines remain untouched.
function eventKey(e){return (e.case||e.problem_id||'')+'/'+e.call_id;}
function failed(e){return ['FAIL','ERROR','BLOCKED'].includes(e.status);}
function stageName(e){return e.stage==='human-review'?'사람 검토 자료 준비':e.stage||'기록 없음';}
function causeText(value){const s=String(value||'원인 상세 기록이 없습니다.');if(s.includes('GOLD_MISMATCH'))return '정답 대조 실패: Python 계산값이 원본 정답과 다릅니다.';if(s.includes('AUDIT_QUOTE_NOT_IN_TEXT'))return '의미 검사 응답의 인용문이 지정한 본문 또는 질문에서 그대로 발견되지 않았습니다.';if(s.includes('FIXED_TEXT_OR_MINIMAL_DELETION_CHANGED'))return '허용된 삭제·고정 문구 조건을 생성 응답이 지키지 않았습니다.';if(s.includes('validation errors for AuditResponse')&&s.includes("input_value={'text':"))return '검토 자료 준비 코드가 저장 파일의 포장을 모델의 답변으로 잘못 검사했습니다. 사람이 내린 판정 오류가 아닙니다.';if(s==='ValidationError')return '응답 형식 검사 오류입니다. 아래의 같은 처리에서 저장된 기록을 확인하세요.';return s;}
function normalizeEvents(events){const begins=new Map(events.filter(e=>e.phase==='START').map(e=>[eventKey(e),e])),ends=new Map(events.filter(e=>e.phase==='END').map(e=>[eventKey(e),e]));return events.map(e=>{const b=begins.get(eventKey(e)),kind=e.kind||b?.kind||'python',fn=e.function||b?.function||'',llm=kind==='llm'||fn==='finarch.shared.providers.cli.run_process'||/\/(?:raw-response|cli-start|cli-result)\.json$/.test(e.path||'');return {...e,kind:llm?'llm':kind,role:e.role||b?.role||'',stage:e.stage||b?.stage||'',content:e.phase==='ARTIFACT'?e.path:e.reason||e.function||e.name||'',elapsed_seconds:e.elapsed_seconds??'',startClosed:ends.has(eventKey(e)),raw:e};});}
function filterEvents(events,choice,caseName,since){return events.filter(e=>(!caseName||e.case===caseName)&&(!since||e.timestamp>=since)&&(choice==='all'||choice==='fail'&&failed(e)||e.kind===choice));}
function sortedEvents(events,key,direction){return [...events].sort((a,b)=>{const av=a[key],bv=b[key],missing=v=>v===undefined||v===null||v==='';if(missing(av)!==missing(bv))return missing(av)?1:-1;return direction*(typeof av==='number'&&typeof bv==='number'?av-bv:String(av??'').localeCompare(String(bv??'')))||Number(a.source_line||0)-Number(b.source_line||0);});}
// [/VL04]
for(const [key,title]of cols){const th=make('th',title);th.tabIndex=0;const click=()=>{dir=sort===key?-dir:-1;sort=key;renderEvents();};th.onclick=click;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click();}};$('heads').append(th);}
function choose(choice,caseName){view=choice;limit=500;if(caseName!==undefined)$('case').value=caseName;for(const b of $('views').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.view===view));renderEvents();}
function detailRows(parent,values){const dl=make('dl');for(const [name,value]of values){dl.append(make('dt',name),make('dd',value??'기록 없음'));}parent.append(dl);}
function details(parent,title,value){const d=make('details');d.append(make('summary',title),make('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));parent.append(d);}
async function showEvent(e){const previous=document.activeElement,dialog=make('dialog'),head=make('div',null,'dialog-head'),body=make('div'),close=make('button','닫기');dialog.setAttribute('aria-label','로그 원인 상세');close.onclick=()=>dialog.close();head.append(make('h2',failed(e)?'실패 원인':'이벤트 상세'),close);dialog.append(head,body);dialog.addEventListener('close',()=>{dialog.remove();if(previous?.isConnected)previous.focus();});document.body.append(dialog);dialog.showModal();const primary=make('div');primary.append(make('p',causeText(e.reason||e.content),'cause'));body.append(primary);detailRows(body,[['문항',e.case],['시각',time(e.timestamp)],['처리',e.kind==='llm'?'LLM':'Python'],['단계',stageName(e)],['검사 함수',e.function],['원본 위치',e.source+' · '+e.source_line+'행']]);details(body,'원본 이벤트',e.raw||e);
try{const q=new URLSearchParams({name:$('run').value,case:e.case,line:String(e.source_line)}),r=await fetch('/api/log-detail?'+q,{cache:'no-store'});if(!r.ok)throw Error('상세 기록을 읽지 못했습니다.');const value=await r.json();if(!dialog.isConnected)return;const saved=value.audit_artifact;if(saved){const report=saved.content,findings=(report.findings||[]).filter(f=>f.judgment==='FAIL');primary.replaceChildren(make('h2',report.failure_kind==='AUDIT_RESPONSE_INVALID'?'17번 검사 응답 확인 실패':'17번 완성 문장 의미 검사 실패'));if(findings.length)for(const f of findings){primary.append(make('p',f.reason,'cause'));for(const evidence of f.evidence||[])primary.append(make('blockquote',(evidence.field==='question'?'질문':'본문')+' · '+evidence.quote,'cause'));}else{primary.append(make('p',causeText(report.reason),'cause'));for(const error of report.response_errors||[])if(error.quote)primary.append(make('blockquote','검사 응답이 인용한 문장 · '+error.quote,'cause'));}if(report.state_reason)primary.append(make('p','관찰 설명 (실패 사유와 별도): '+report.state_reason,'muted'));details(primary,'실제 검사 결과 · '+saved.path,report);}const next=value.following_artifact;if(next){const c=next.content;body.append(make('h2','같은 처리에서 실패 직후 저장된 기록'));if(c?.reason)body.append(make('p',causeText(c.reason),'cause'));if(c?.human_decision==='PENDING')body.append(make('p','사람 판정 전 자료입니다.','muted'));if(c?.findings)for(const f of c.findings.filter(f=>f.judgment==='FAIL'))body.append(make('p',f.reason,'cause'));details(body,next.path,c);}if(e.stage==='human-review'&&data.reviews?.[e.case]){const v=data.reviews[e.case];body.append(make('p',`현재 다시 읽은 검토 자료: ${v.ready}/${v.total}개 검토 가능. 이 팝업의 과거 실패 기록은 보존됩니다.`,'current'));}}catch(error){body.append(make('p',error.message,'muted'));}}
function renderEvents(){if(!data)return;const normalized=normalizeEvents(data.events),rows=sortedEvents(filterEvents(normalized,view,$('case').value,$('current').checked?data.progress?.started_at:null),sort,dir);$('events').replaceChildren();if(!rows.length){const tr=make('tr'),td=make('td','선택한 조건에 맞는 이벤트가 없습니다.');td.colSpan=9;tr.append(td);$('events').append(tr);}for(const e of rows.slice(0,limit)){const tr=make('tr',null,e.kind+(failed(e)?' failure':''));for(const [k]of cols){let v=e[k]??'—';if(k==='timestamp')v=time(v);if(k==='kind')v=e.kind==='llm'?'LLM':'Python';if(k==='stage')v=stageName(e);if(k==='phase'||k==='status')v=labels[v]||v;if(k==='status'&&e.phase==='START')v=e.startClosed?'시작 기록':'종료 기록 없음';if(k==='elapsed_seconds'&&typeof v==='number')v=v.toFixed(2)+'초';const td=make('td',v,k==='status'?e.status:'');if(k==='kind')td.replaceChildren(make('span',v,'tag '+e.kind));if(k==='status'&&failed(e)){const b=make('button','실패 원인 ↗','failure-link');b.onclick=()=>showEvent(e);td.replaceChildren(b);}if(k==='content'){const b=make('button',(e.content||'원본 보기').slice(0,140),failed(e)?'failure-link':'');b.onclick=()=>showEvent(e);td.replaceChildren(b);}tr.append(td);}$('events').append(tr);}$('count').textContent=`${Math.min(limit,rows.length)} / ${rows.length}개 이벤트 · 과거 실패도 보존됩니다.`;$('more').hidden=rows.length<=limit;}
function render(){const p=data.progress||{},entries=Object.entries(p.cases||{}),ev=normalizeEvents(data.events);$('phase').textContent=p.message||'제작 진행 상태 파일이 아직 없습니다. 아래는 저장된 원본 이벤트입니다.';const active=data.events.filter(e=>(!p.started_at||e.timestamp>=p.started_at)&&e.phase==='START'&&e.kind==='llm'&&e.function==='finarch.shared.providers.cli.CLITransport.__call__'),ends=new Map(data.events.filter(e=>e.phase==='END').map(e=>[eventKey(e),e]));$('metrics').replaceChildren();for(const [title,value]of [['LLM 호출 시작',active.length],['종료 기록 없음',active.filter(e=>!ends.has(eventKey(e))).length],['호출 처리 통과',active.filter(e=>ends.get(eventKey(e))?.status==='PASS').length],['호출 처리 실패',active.filter(e=>failed(ends.get(eventKey(e))||{})).length]]){const c=make('div',title,'card');c.append(make('b',value));$('metrics').append(c);}$('metrics').append(make('span','호출 처리 통과와 문장 의미 검사 통과는 다릅니다.','muted small'));const table=make('table'),head=make('tr');for(const t of ['문항','현재 상태','문장 생성','의미 검사','검토 가능','비고','실패 기록'])head.append(make('th',t));table.append(head);const prior=$('case').value;$('case').replaceChildren(new Option('전체 문항',''));for(const name of [...new Set([...entries.map(([name])=>name),...data.events.map(e=>e.case)])].sort())$('case').append(new Option(name,name));$('case').value=prior;for(const [name,v]of entries){const tr=make('tr'),review=data.reviews?.[name],failures=ev.filter(e=>e.case===name&&failed(e));let reason=v.reason||'';if(review&&/^\uac80\ud1a0 \uac00\ub2a5/.test(reason))reason=`현재 검토 가능 ${review.ready}/${review.total} · 의미 실패 ${review.failed} · 미평가 ${review.unassessed}`;for(const value of [name,labels[v.status]||v.status,v.generated??'—',v.audited??'—',review?review.ready+'/'+review.total:'—',reason])tr.append(make('td',value));const td=make('td',null,'case-action');if(failures.length){const b=make('button',`실패 ${failures.length}건 보기`,'failure-link');b.onclick=()=>{choose('fail',name);$('event-title').scrollIntoView({block:'center'});};const last=make('button','최근 원인 ↗','failure-link');last.onclick=()=>showEvent(failures.at(-1));td.append(b,last);}else td.textContent='—';tr.append(td);table.append(tr);}$('cases').replaceChildren(table);renderEvents();}
async function poll(){if(busy||!$('run').value)return;busy=true;try{const r=await fetch('/api/live?name='+encodeURIComponent($('run').value),{cache:'no-store'});if(!r.ok)throw Error('로그를 읽을 수 없습니다.');data=await r.json();$('error').textContent=data.damaged?.length?`아직 읽을 수 없는 원본 행 ${data.damaged.length}개: 다음 갱신 때 다시 읽습니다.`:'';$('updated').textContent='갱신 '+time(new Date().toISOString());$('viewer').href='/?run='+encodeURIComponent($('run').value);render();}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
for(const b of $('views').querySelectorAll('button'))b.onclick=()=>choose(b.dataset.view);for(const id of ['case','current'])$(id).onchange=()=>{limit=500;renderEvents();};$('run').onchange=()=>{data=null;$('case').value='';poll();};$('refresh').onclick=poll;$('more').onclick=()=>{limit+=500;renderEvents();};
(async()=>{try{const runs=await(await fetch('/api/runs')).json();for(const r of runs)$('run').append(new Option(r.name,r.name));const q=new URLSearchParams(location.search),name=q.get('run');if(runs.some(r=>r.name===name))$('run').value=name;await poll();if(q.get('case'))$('case').value=q.get('case');if(q.get('view'))choose(q.get('view'));}catch(e){$('error').textContent=e.message;}})();setInterval(()=>{if($('auto').checked)poll();},2000);
</script></html>
